[package]
name = "sidermux-rt"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Runtime startup for sidermux targets, selected per architecture"
repository = "https://github.com/sidermux/sidermux-hal"
license = "MIT OR Apache-2.0"

[features]
# Architecture startup selection. Binaries enable this through their SoC
# feature (sidermux-bootloader's cyclone-v forwards here).
armv7a = []

[dependencies]

[package.metadata.docs.rs]
targets = ["armv7a-none-eabi"]
all-features = true
