[package]
name          = "sidermux-hal"
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.95.0"
description   = "Bare-metal HAL for SoC FPGAs: one interface, many architectures and boards"
keywords      = ["embedded", "embedded-hal", "fpga", "soc", "no-std"]
categories    = ["embedded", "hardware-support", "no-std"]
repository    = "https://github.com/sidermux/sidermux-hal"
license       = "MIT OR Apache-2.0"

[features]
# SoC targets. Each SoC implies the architecture family it is built on;
# the bootloader forwards its own SoC feature to these.
cyclone-v = ["arch-armv7a", "sidermux-pac/cyclone-v"]

# Architecture support. Selectable without a SoC for CPU-level code that
# several SoCs can share; binaries must still pick exactly one SoC.
arch-armv7a = []

[dependencies]
sidermux-pac = { path = "../sidermux-pac", version = "0.1.0", default-features = false }

[package.metadata.docs.rs]
all-features = true
