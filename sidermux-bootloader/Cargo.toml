[package]
name = "sidermux-bootloader"
version = "0.1.0"
edition = "2024"
description = "Bootable image flow for sidermux targets"
repository = "https://github.com/sidermux/sidermux-hal"
license = "MIT OR Apache-2.0"

[[bin]]
name = "sidermux-bootloader"
path = "src/main.rs"
bench = false
test  = false

[features]
# SoC selection for the bootable image. Exactly one is required; each SoC
# feature forwards the SoC and architecture selection to the HAL and runtime.
cyclone-v = ["sidermux-hal/cyclone-v", "sidermux-rt/armv7a"]

# Board selection: implies its SoC and forwards the board configuration.
board-de1-soc = ["cyclone-v", "sidermux-hal/board-de1-soc"]

[dependencies]
sidermux-hal = {path = "../sidermux-hal"}
sidermux-rt = {path = "../sidermux-rt"}
